# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # Homepage launchpad copy. All visible homepage text lives here so it can be
  # reworded without touching the view.
  home:
    page_title: "Quartets"
    # The masthead gag: one is sampled per page load (same re-roll spirit as
    # Multicolor and the quips). Short and long both work — the view hands the
    # nameplate a per-name --np-scale so it sizes to fit the wordmark's width.
    nameplates:
      - "The New Dork Times"
      - "The New War Times"
      - "The New York Crimes"
      - "The Beige Lady"
      - "The New York Stenographer"
      - "The Furrowed Brow"
      - "The Deeply Concerned"
      - "The Daily Equivocator"
      - "The Fourth Estate Sale"
      - "The Both Sides Bugle"
      - "The Overton Windower"
      - "The Gray Wishy-Washy"
      - "The Manufactured Consent"
      - "The New York Tsk-Tsk"
      - "The Paper of Record Scratch"
      - "The Neoliberal Ledger"
      - "The Status Quo Gazette"
      - "The New York Hedge"
      - "The Op-Ed Industrial Complex"
      - "The New York Chymes"
      - "The Centrist Sentinel"
      - "The Grown Ups Are Speaking"
      - "The Anonymous Sources Say"
      - "The Weapons of Mass Discourse"
      - "The Deeply Troubled Times"
      - "The Reasonable People Disagree"
      - "The New York Enterprise (A Subsidiary)"
      - "The Nuance Havers' Daily"
      - "The New York Squish"
      - "The Very Fine People on Both Sides"
      - "The Column Inches for Warmongers"
      - "The David Brooks Appreciation Society"
      - "The Bari Weiss Farewell Tour"
      - "The Judith Miller Memorial Lecture"
      - "The Democracy Dies in Moderation"
      - "All the News That Fits the Narrative"
      - "The Some Say Otherwise"
      - "The Thought Leader Quarterly"
      - "The New York Shrug"
      - "The Milquetoast Monitor"
      - "The Cocktail Party Consensus"
      - "The Institutional Voice"
      - "The Norms and Civility Courier"
      - "The Private Equity Press"
      - "The Capitalist Courier"
      - "The Late-Capitalism Courier"
    wordmark: "Quartets"
    lede_html: "Create and solve NYT Connections-style puzzles."
    hero:
      pitch: "Free, open-source, and anonymous."
      create_cta: "Make a Quartet"
      # The solved board in the masthead. Decorative, but it's the first quartet
      # anyone sees, so it has to be a *real* one — and it picks up the joke the
      # nameplate above it is telling. Rows render purple → yellow (hardest to
      # easiest): fill-in-the-blank for the purple, proper nouns for the yellow.
      board:
        - cat: "Deeply ___"
          words: "CONCERNED · TROUBLED · SOURCED · DIVIDED"
        - cat: "Both-sidesing"
          words: "HEDGE · WAFFLE · STRADDLE · EQUIVOCATE"
        - cat: "Paywall-speak"
          words: "SUBSCRIBE · UNLOCK · PREMIUM · METERED"
        - cat: "Op-ed mainstays"
          words: "BROOKS · FRIEDMAN · DOUTHAT · STEPHENS"
      browse_cta: "Browse the archive"
      aside_html: "Wanna see stats about your puzzles? Or about your own attempts (a trophy case!)? %{signup} whenever."
      signup: "Sign up"
    strip:
      head: "Jump in"
      by_html: "by %{author}" # _html so the author interpolation may be a profile link
      played: "Played"
      cta: "The whole archive"
      # Shown in place of the strip when there's genuinely nothing left to play —
      # every published quartet is either yours or already finished.
      cleared_head: "You've completed every puzzle we have, you nerd!"
      cleared_note: "Why don't you go make some instead?"
      cleared_cta: "Make one"
    why:
      head: "Why play here"
      features:
        - lead: "Free."
          note: "All the puzzles and stats, free forever, devoid of paywalls or \"pro\" tier nonsense."
        - lead: "Build your own."
          note: "Make your own Quartets with a super easy to use (IMO), mobile-friendly tool. (With auto-saving so do you don't accidentally lose your work when you accidentally refresh the page!) Keep it private to send to just your friends, or publish on the site for strangers to take a crack at it."
        - lead: "Real stats."
          note: "Solve rate, mistakes per game, the wrong guesses everyone falls for. You gotta sign up to see it. (No worries, that's not some nonsense engagement generation tactic. We just need to tie stats to a user for stats to work.)"
        - lead: "Earn trophies."
          note: "Perfects. Or purple-firsts. Or go for the reverse-rainbow like a goddam all-star."
        - lead: "Leaderboards."
          note: "Coming soon. Maybe. If we get enough users. Either way, start padding your stats now."
    about:
      head: "Ethically built"
      columns:
        - head: "Anonymous, private, and free"
          bullets:
            - label: "No ads"
              note: "Nothing flashing, nothing chasing your cursor, nothing auto-playing at you."
            - label: "No tracking"
              note: "No pixels, no fingerprinting, no \"anonymous\" analytics that aren't."
            - label: "No data collection"
              note: "We don't want to sell your data. Your data or puzzles aren't the product. There is no product."
            - label: "No AI training"
              note: "Scraper bots that train on your words get a 403. Go make your own, clankers."
            - label: "Free forever"
              note: "No paywall, no premium tier, no bait-and-switch down the road."
        - head: "❤️ the free & open internet"
          bullets:
            - label: "Open source"
              note_html: "The whole thing's on <a href=\"https://github.com/johnhutch/quartets\" target=\"_blank\" rel=\"noopener\">GitHub</a>. Read it, fork it, host your own."
            - label: "MIT license"
              note_html: "The no-strings <a href=\"https://github.com/johnhutch/quartets/blob/main/LICENSE\" target=\"_blank\" rel=\"noopener\">license</a>: take the code, change it, ship it, even sell it — just keep the credit line. That's what keeps free code actually free."
            - label: "CC BY 4.0"
              note_html: "The content we wrote — our own puzzles, the copy, the docs — is free to <a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" rel=\"noopener\">take and remix with credit</a>. Our work, our grant."
            - label: "Your puzzles are yours"
              note_html: "Creators keep full copyright of every quartet they make. We take <a href=\"/terms\">just enough license</a> to host and show them — nothing transfers, nothing gets sold, nothing gets relicensed."
        - head: "Legalese"
          bullets:
            - label: "The terms"
              note_html: "The \"your puzzles are yours\" deal, in writing. <a href=\"/terms\">Read the terms</a> — they're short and in English."
            - label: "Privacy policy"
              note_html: "Short version: we don't creep. <a href=\"/privacy\">The privacy policy</a> is the long version. It's also short."
        - head: "Credits"
          bullets:
            - label: "Who's responsible for this?"
              note_html: "Sup. I'm <a href=\"https://johnhutch.com\" target=\"_blank\" rel=\"noopener\">Hutch</a>."
            - label: "Can you make me a thing?"
              note_html: "Sure. But it's my job, so, probably not for free. I run <a href=\"https://swiftkickweb.com\" target=\"_blank\" rel=\"noopener\">Swiftkick Web</a>, so, hit us up if you need some help. Or just some advice. Whatever."
      disclaimer: "Quartets is an independent project. It is not affiliated with, endorsed by, or connected to The New York Times or any of its subsidiaries. \"Connections\" and \"The New York Times\" are trademarks of The New York Times Company. The whole point is that you can't copyright a grid of colored squares — but let's be clear about it anyway."

  # Snarky game-over quips (ADR-0011). One is picked at random per finished game.
  # Each bucket needles you toward the next rung — except reverse_rainbow, which has
  # nothing above it to diminish. Append freely; the game just samples the array.
  quartets:
    trophies:
      perfect: "Perfect"
      purple_first: "Purple first"
      reverse_rainbow: "Reverse rainbow"
    quips:
      loss:
        - "Oof."
        - "So close."
        - "Maybe next time."
        - "Eh, you'll get 'em next time."
        - "The puzzle won. It happens."
        - "Sad." 
        - "Embarrassing."
        - "Gross." 
        - "Shameful." 
      mistakes:
        - "A win's a win, I guess."
        - "Solved it. Barely."
        - "Good job! Ish." 
        - "You got there. Eventually."
        - "Nice."
        - "That'll do, pig."
        - "Good enough!"
        - "Not bad. Not great, but not bad." 
      perfect:
        - "Perfect! Pretty good." 
        - "Not a single mistake. Respectable. Not purple-first respectable, but it'll do." 
        - "Clean sweep! Now try cracking the hard group first."
        - "Perfect run. The purple-first players are condescendingly."
        - "Well done! Purple-first next time?"
        - "FLAWLESS VICTORY."
        - "PERFECT!"
        - "Look at you not making any mistakes! Not bad!"
      purple_first:
        - "PURPLE FIRST! PURPLE FIRST! PURPLE FIRST!"
        - "Ooo, purple first. Respect." 
        - "Hardest group out of the gate. Good stuff. Almost a perfect rainbow, even." 
        - "Purple first — slick. The reverse-rainbow folks are slicker tho." 
        - "Bold open. One ladder rung left to climb."
        - "So good it's almost a reverse rainbow!"
      reverse_rainbow:
        - "Reverse rainbow!"
        - "Purple to yellow, no mistakes. Hell yeah."
        - "The full reverse. Absolute filth. No notes."
        - "Hardest-first, perfect, in order."
        - "GOAT"
        - "Lookit that stack. Love it."
        - "Reverse rainbow! What a stud."
        - "Reverse rainbow? You nerd. Look at the nerdy nerd with their nerdy reverse rainbow. ...Nerd."
